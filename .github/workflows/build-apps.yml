# Builds the Android APK and the Windows installer + portable .exe on every push.
# To publish them as a GitHub Release: push a tag like v1.1.0, or run this workflow by hand
# (Actions → Build apps → Run workflow) with a version filled in; it makes the tag itself.
#
# Optional repository secrets:
#   BITCAL_KEYSTORE_BASE64, BITCAL_STORE_PASSWORD, BITCAL_KEY_ALIAS, BITCAL_KEY_PASSWORD
#     → a signed release APK as well as the debug one (README → Android app)
#   GOOGLE_DESKTOP_CLIENT_ID, GOOGLE_DESKTOP_CLIENT_SECRET
#     → Google sign-in in the Windows app (README → Windows app)
name: Build apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish as a release with this version tag (e.g. v1.1.0). Empty: just build.'
        required: false
        default: ''

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches platform 36 if missing.
      - run: npm ci
      - run: npx cap sync android
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.BITCAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BITCAL_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APKs
        working-directory: android
        env:
          VERSION: ${{ inputs.release || github.ref_name }}
          BITCAL_STORE_PASSWORD: ${{ secrets.BITCAL_STORE_PASSWORD }}
          BITCAL_KEY_ALIAS: ${{ secrets.BITCAL_KEY_ALIAS }}
          BITCAL_KEY_PASSWORD: ${{ secrets.BITCAL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug $([ -n "$BITCAL_STORE_FILE" ] && echo assembleRelease) --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/Bitcalendar-${VERSION//\//-}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk "../out/Bitcalendar-${VERSION//\//-}-signed.apk"; fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Google desktop client
        shell: pwsh
        env:
          ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if ($env:ID) {
            $c = Get-Content desktop/config.json | ConvertFrom-Json
            $c.googleClientId = $env:ID; $c.googleClientSecret = $env:SECRET
            $c | ConvertTo-Json | Set-Content desktop/config.json
          }
      - name: Build installer + portable exe
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/*.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: Bitcalendar ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
          body: |
            **Android:** download the `.apk` on your phone, open it, allow "install unknown apps". Widgets: long-press the home screen → Widgets → Bitcalendar.
            **Windows:** `Bitcalendar-Setup-*.exe` installs it; `*-portable.exe` runs without installing. Unsigned, so SmartScreen asks once: More info → Run anyway.
