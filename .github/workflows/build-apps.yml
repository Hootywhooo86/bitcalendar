# Builds the Android APK and the Windows installer + portable .exe on every push.
# Push a tag like v1.1.0 to publish both as a GitHub Release.
#
# Optional repository secrets:
#   BITCAL_KEYSTORE_BASE64, BITCAL_STORE_PASSWORD, BITCAL_KEY_ALIAS, BITCAL_KEY_PASSWORD
#     → a signed release APK as well as the debug one (README → Android app)
#   GOOGLE_DESKTOP_CLIENT_ID, GOOGLE_DESKTOP_CLIENT_SECRET
#     → Google sign-in in the Windows app (README → Windows app)
name: Build apps

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches platform 36 if missing.
      - run: npm ci
      - run: npx cap sync android
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.BITCAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BITCAL_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APKs
        working-directory: android
        env:
          BITCAL_STORE_PASSWORD: ${{ secrets.BITCAL_STORE_PASSWORD }}
          BITCAL_KEY_ALIAS: ${{ secrets.BITCAL_KEY_ALIAS }}
          BITCAL_KEY_PASSWORD: ${{ secrets.BITCAL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug $([ -n "$BITCAL_STORE_FILE" ] && echo assembleRelease) --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/Bitcalendar-${GITHUB_REF_NAME//\//-}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk "../out/Bitcalendar-${GITHUB_REF_NAME//\//-}.apk"; fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Google desktop client
        shell: pwsh
        env:
          ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if ($env:ID) {
            $c = Get-Content desktop/config.json | ConvertFrom-Json
            $c.googleClientId = $env:ID; $c.googleClientSecret = $env:SECRET
            $c | ConvertTo-Json | Set-Content desktop/config.json
          }
      - name: Build installer + portable exe
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/*.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
