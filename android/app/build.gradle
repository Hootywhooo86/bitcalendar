apply plugin: 'com.android.application'

android {
    namespace = "app.bit128.bitcalendar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.bit128.bitcalendar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing: keystore.properties next to this file (storeFile, storePassword, keyAlias,
    // keyPassword), or the same as BITCAL_* environment variables in CI. Without them, release
    // builds are left unsigned and the debug APK is the one to install.
    def ks = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
    def ksValue = { String k -> ks.getProperty(k) ?: System.getenv('BITCAL_' + k.replaceAll(/([A-Z])/, '_$1').toUpperCase()) }
    signingConfigs {
        if (ksValue('storeFile')) {
            release {
                storeFile file(ksValue('storeFile'))
                storePassword ksValue('storePassword')
                keyAlias ksValue('keyAlias')
                keyPassword ksValue('keyPassword')
            }
        }
    }
    // Widget tests run the real Android framework on the JVM (Robolectric), including how the
    // home screen inflates and draws widgets: ./gradlew testDebugUnitTest
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'bitcal.out', file("$buildDir/widget-renders").absolutePath
                jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.nio=ALL-UNNAMED'
                // Machines that can't reach Maven from inside tests: put the android-all jar here.
                def jars = new File(System.getProperty('user.home'), 'robolectric-jars')
                if (jars.isDirectory()) { systemProperty 'robolectric.offline', 'true'; systemProperty 'robolectric.dependency.dir', jars.absolutePath }
            }
        }
    }
    buildTypes {
        release {
            if (ksValue('storeFile')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-auth:21.4.0" // Google sign-in (GooglePlugin)
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
